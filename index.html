<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll App &ndash; Collect Feedback, Unlock Ideas</title>
  <meta name="description" content="Create and share surveys in minutes, collect opinions and see the results live.">
  <link rel="icon" href="assets/img/logo-orange.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nerko+One&family=Mulish:wght@400;500;600;700;800&family=Nokora:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style/variables.css">
  <link rel="stylesheet" href="style/base.css">
  <link rel="stylesheet" href="style/layout.css">
  <link rel="stylesheet" href="style/components.css">
  <link rel="stylesheet" href="style/overlay.css">
  <link rel="stylesheet" href="style/responsive.css">
  <script src="js/data.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/surveys.js" defer></script>
  <script src="js/templates.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/detail.js" defer></script>
  <script src="js/form.js" defer></script>
  <script src="js/main.js" defer></script>
</head>

<body onload="init()">

  <header class="page-header">
    <a href="index.html" class="logo-link" aria-label="Poll App home">
      <img src="assets/img/logo-orange.svg" alt="Poll App logo" width="150" height="70">
    </a>
  </header>

  <main>

    <section class="hero" aria-labelledby="hero-headline">
      <div class="hero-text">
        <h1 id="hero-headline">Collect Feedback,<br>Unlock Ideas</h1>
        <p>
          Create and share surveys in minutes &ndash; from team events to workplace culture.
          Collect opinions, engage your audience, and turn feedback into action.
        </p>
        <button type="button" class="btn btn-primary" onclick="openCreateForm()">
          <span>New survey</span>
          <span class="btn-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="hero-visual">
        <img class="hero-image" src="assets/img/hero-visual.png" alt="Illustration of a survey on a mobile screen"
          width="420" height="420">
        <img class="hero-icon hero-icon-bubble" src="assets/img/typing-bubble.svg" alt="" width="196" height="142">
        <img class="hero-icon hero-icon-check" src="assets/img/check.svg" alt="" width="112" height="113">
        <img class="hero-icon hero-icon-star" src="assets/img/star.svg" alt="" width="81" height="78">
        <img class="hero-icon hero-icon-question" src="assets/img/question-mark.svg" alt="" width="77" height="87">
      </div>
    </section>

    <section class="surveys" aria-labelledby="surveys-headline">
      <h2 id="surveys-headline">Your surveys</h2>

      <section class="ending-soon" aria-labelledby="ending-soon-headline">
        <h3 id="ending-soon-headline">Ending soon surveys</h3>
        <div id="ending-soon-list" class="ending-soon-list"></div>
      </section>

      <div class="list-controls">
        <div class="tabs" role="tablist" aria-label="Survey status">
          <button type="button" id="tab-active" class="tab" role="tab" aria-selected="true"
            onclick="showTab('active')">Active survey</button>
          <button type="button" id="tab-past" class="tab" role="tab" aria-selected="false"
            onclick="showTab('past')">Past survey</button>
        </div>

        <div class="category-filter">
          <button type="button" id="filter-trigger" class="filter-trigger" aria-expanded="false"
            aria-controls="filter-menu" onclick="toggleCategoryMenu()">
            <span id="filter-label">Filter by category</span>
            <span class="filter-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <ul id="filter-menu" class="filter-menu d-none" aria-label="Categories"></ul>
        </div>
      </div>

      <div id="survey-list" class="survey-list"></div>
      <p id="survey-list-empty" class="survey-list-empty d-none">No surveys in this category.</p>
    </section>

  </main>

  <div id="detail-overlay" class="overlay d-none" role="dialog" aria-modal="true"
    aria-label="Survey details"></div>

  <div id="create-overlay" class="overlay d-none" role="dialog" aria-modal="true"
    aria-label="Create a new survey"></div>

  <div id="toast" class="toast d-none" role="status" aria-live="polite"></div>

</body>

</html>
